<h1>两周试填：一页勾完就能预约（不卖硬件）</h1>
<div class="warn">预约只存本机草稿或留下联系方式沟通试填，不推销传感器，不开药。</div>
<p>访谈里常见一句：「先让我白用两周，真省事再谈钱。」还有：「表可以，别超过一页。」</p>
<ol>
<li>打开落地页，先读红线（非诊疗、不开药）</li>
<li>把观察五项勾一遍——陌生人也能独立完成</li>
<li>需要的话点“预约试填”，留下称呼和手机</li>
</ol>
<p>钱的事以后再说；这周只验证：你会不会愿意用一页纸把“哪天开始不好”记清楚。</p>
