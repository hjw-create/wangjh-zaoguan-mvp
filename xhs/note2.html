    <h1 class="title">我们不开药：观察清单能帮什么、不能帮什么</h1>
    <div class="warn"><strong>红线写在最前：</strong>非诊疗、不开药、不替代兽医、不卖传感器。</div>
    <p class="p">有人原话：「网上开药我不敢信，出了事谁负责。」也有人说：「一张表告诉我先看啥可以，别一上来买系统。」</p>
    <p class="p"><strong>能帮你的</strong>：提醒先看采食/粪便/呼吸/精神/体温感；把“哪天开始不好”记下来；一页纸、人话、家属也能勾。</p>
    <p class="p"><strong>不能帮你的</strong>：不下诊断、不开处方、不保证少损失、不绑硬件。</p>
    <p class="p">红线清楚，你再决定要不要试填。</p>
